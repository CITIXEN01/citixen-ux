<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting — Citixen UX</title>
<meta name="robots" content="noindex">
<noscript><meta http-equiv="refresh" content="1;url=/muni/holmen-wi/gateway"></noscript>
<style>
:root{--bg:#0B0F17;--card:#121824;--line:#1E293B;--mint:#34D399;--cyan:#38BDF8;--ink:#F8FAFC;--mut:#94A3B8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:24px}
.card{width:min(460px,100%);padding:34px 30px 30px;background:var(--card);border:1px solid rgba(56,189,248,.4);border-radius:16px;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}
img{height:28px;width:auto;margin-bottom:22px}
h1{margin:0 0 10px;font-weight:600;font-size:20px;line-height:1.35;letter-spacing:-.01em;color:var(--mint);text-shadow:0 0 14px rgba(52,211,153,.4)}
p{margin:0 0 6px;color:var(--mut);font-size:14px}
.path{display:inline-block;max-width:100%;overflow-wrap:anywhere;margin:2px 0 14px;padding:3px 10px;border-radius:9999px;border:1px solid rgba(56,189,248,.4);background:rgba(56,189,248,.1);color:var(--cyan);font:500 12px ui-monospace,Menlo,Consolas,monospace}
.bar{height:3px;margin:18px 0 14px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint);box-shadow:0 0 8px rgba(52,211,153,.6);animation:fill 1s linear forwards}
@keyframes fill{to{width:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
a{color:var(--mint);font-weight:700;font-size:14px}
</style>
</head>
<body>
<main class="card" role="status" aria-live="polite">
  <img src="/logo.svg" alt="CITIXEN UX" width="159" height="30">
  <h1>Redirecting to Village of Holmen Gateway...</h1>
  <p>That address doesn't match a page.</p>
  <span class="path" id="p"></span>
  <div class="bar" aria-hidden="true"><i></i></div>
  <p>Redirecting in <b id="n">1</b> second…</p>
  <a href="/muni/holmen-wi/gateway" id="go">Go now</a>
</main>
<script>
(function(){
  var TO = '/muni/holmen-wi/gateway';
  try { document.getElementById('p').textContent = location.pathname.slice(0, 120); } catch (e) {}
  if (location.pathname === TO) return; // never loop on the gateway itself
  setTimeout(function(){ location.replace(TO); }, 1000);
})();
</script>
</body>
</html>
