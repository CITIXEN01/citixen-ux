<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
(function(){
  try {
    if (localStorage.getItem('citixen_auth_token') !== '1') {
      document.documentElement.classList.add('citixen-gate-locked');
    }
  } catch (e) { /* fails open, same as app.html/operator.html */ }
})();
</script>
<title>CITIXEN UX™ · Feedback Ingestion Queue</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#00E699">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=5">
<style>
:root{
  --bg-obsidian:#030712; --mint:#00E699; --mint2:#00c985; --text:#f8fafc; --muted:#8e9fa8;
  --surface-card-bg:rgba(5,11,20,0.8); --surface-card-border:1px solid rgba(0,230,153,0.2); --surface-blur:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-obsidian);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;min-height:100vh;padding:24px 16px calc(40px + env(safe-area-inset-bottom,0px));box-sizing:border-box}

.citixen-gate{display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;
  background:rgba(2,6,23,.92);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);padding:24px;box-sizing:border-box}
html.citixen-gate-locked .citixen-gate{display:flex}
html.citixen-gate-locked body{overflow:hidden}
.citixen-gate-card{width:100%;max-width:360px;background:rgba(2,6,23,.8);border:1px solid rgba(30,41,59,.85);
  border-radius:18px;padding:32px 26px;text-align:center;box-shadow:0 0 40px rgba(0,0,0,.6);box-sizing:border-box}
.citixen-gate-brand{font-weight:800;font-size:.9rem;letter-spacing:.3px;color:#00E699;margin-bottom:20px}
.citixen-gate-label{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:14px}
.citixen-gate-input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.14);
  border-radius:10px;color:#f1f5f9;padding:14px 16px;font-size:1rem;text-align:center;letter-spacing:.1em;margin-bottom:12px;font-family:inherit}
.citixen-gate-input:focus{outline:none;border-color:rgba(0,230,153,.5)}
.citixen-gate-error{font-size:.7rem;color:#f87171;font-weight:700;margin-bottom:10px;min-height:14px}
.citixen-gate-btn{width:100%;box-sizing:border-box;background:#00E699;color:#051311;border:none;padding:13px;
  border-radius:10px;font-weight:800;font-size:.85rem;cursor:pointer;font-family:inherit}

.op-header{text-align:center;margin-bottom:18px}
.op-brand{font-weight:900;font-size:1rem;letter-spacing:.04em;color:var(--mint)}
.op-brand .tm{font-size:.6em;vertical-align:super}
.back-link{display:block;text-align:center;font-size:.68rem;font-weight:700;color:var(--muted);text-decoration:none;margin-top:6px}

.card{background:var(--surface-card-bg);backdrop-filter:blur(var(--surface-blur));border:var(--surface-card-border);
  border-radius:12px;padding:16px;margin-bottom:14px}
.label{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px}

/* ===== DROP / PASTE ZONE ===== */
.drop-zone{border:2px dashed rgba(255,255,255,.14);border-radius:12px;padding:22px 14px;text-align:center;
  cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:12px}
.drop-zone.dragover{border-color:var(--mint);background:rgba(0,230,153,.06)}
.drop-zone-text{font-size:.74rem;font-weight:700;color:var(--muted)}
.drop-zone-sub{font-size:.62rem;color:var(--muted);opacity:.7;margin-top:4px}
.drop-zone input[type=file]{display:none}
.drop-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.drop-preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,.1)}

.textarea{width:100%;min-height:90px;padding:11px 13px;background:rgba(3,7,18,.95);border:1px solid rgba(255,255,255,.08);
  color:var(--text);border-radius:10px;font-family:inherit;font-size:.82rem;resize:vertical}
.textarea:focus{outline:none;border-color:rgba(0,230,153,.5)}

.btn-synth{width:100%;box-sizing:border-box;background:var(--mint);color:#051311;border:none;padding:13px;
  border-radius:10px;font-weight:800;font-size:.82rem;cursor:pointer;margin-top:12px;font-family:inherit}
.btn-synth:disabled{opacity:.5;cursor:not-allowed}

/* ===== QUEUE ITEMS ===== */
.queue-item{background:rgba(3,7,18,.6);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.queue-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.queue-item-note{font-size:.72rem;color:var(--text);line-height:1.4;max-height:3.6em;overflow:hidden;flex:1}
.status-pill{flex-shrink:0;font-size:.58rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.status-pill.queued{background:rgba(148,163,184,.14);color:#94a3b8;border-color:rgba(148,163,184,.4)}
.status-pill.in-execution{background:rgba(245,158,11,.14);color:#f59e0b;border-color:rgba(245,158,11,.4)}
.status-pill.resolved{background:rgba(0,230,153,.14);color:var(--mint2);border-color:rgba(0,230,153,.4)}
.queue-prompt{background:#030712;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.64rem;color:#94a3b8;
  white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto;margin-bottom:8px}
.btn-copy-prompt{width:100%;background:rgba(0,230,153,.08);border:1px solid rgba(0,230,153,.3);color:var(--mint2);
  padding:9px;border-radius:8px;font-weight:700;font-size:.68rem;cursor:pointer;font-family:inherit}
.btn-copy-prompt.copied{color:#34d399}
.empty-note{font-size:.72rem;color:var(--muted);text-align:center;padding:10px 0}
</style>
</head>
<body>

<div class="citixen-gate" id="citixenGate">
  <form class="citixen-gate-card" id="citixenGateForm" autocomplete="off">
    <div class="citixen-gate-brand">CITIXEN UX<sup class="tm-symbol">™</sup></div>
    <div class="citixen-gate-label">Enter Access Passcode</div>
    <input type="password" class="citixen-gate-input" id="citixenGateInput" placeholder="••••••••"
      autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="citixen-gate-error" id="citixenGateError"></div>
    <button type="submit" class="citixen-gate-btn">Unlock</button>
  </form>
</div>

<div class="wrap">
  <div class="op-header">
    <div class="op-brand">FEEDBACK INGESTION QUEUE</div>
    <a class="back-link" href="/operator">← Network Operator Control</a>
  </div>

  <div class="card">
    <div class="label">Drop / Paste Feedback</div>
    <div class="drop-zone" id="dropZone" tabindex="0">
      <div class="drop-zone-text">Drop or paste a screenshot, or click to choose a file</div>
      <div class="drop-zone-sub">SMS/DM screenshots work great here</div>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>
    <div class="drop-preview" id="dropPreview"></div>
    <textarea class="textarea" id="rawFeedback" placeholder="Paste or type the raw feedback text…"></textarea>
    <button type="button" class="btn-synth" id="btnSynthesize">Synthesize Claude Task Prompt</button>
  </div>

  <div class="card">
    <div class="label">Queue</div>
    <div id="queueList"></div>
  </div>
</div>

<script>
'use strict';
const CITIXEN_AUTH_KEY = 'citixen_auth_token';
const CITIXEN_GATE_PASSCODE = 'citixen_01';
(function initCitixenGate(){
  const form = document.getElementById('citixenGateForm');
  const input = document.getElementById('citixenGateInput');
  const errorEl = document.getElementById('citixenGateError');
  if (!form || !input || !errorEl) return;
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value.trim() === CITIXEN_GATE_PASSCODE) {
      try { localStorage.setItem(CITIXEN_AUTH_KEY, '1'); } catch (err) {}
      errorEl.textContent = '';
      document.documentElement.classList.remove('citixen-gate-locked');
    } else {
      errorEl.textContent = 'Incorrect passcode — try again.';
      input.value = '';
      input.focus();
    }
  });
  if (document.documentElement.classList.contains('citixen-gate-locked')) {
    setTimeout(() => input.focus(), 250);
  }
})();

// ===== STATE — persisted to localStorage so the queue survives a reload.
// Images are kept only as data URLs for this beta's in-browser preview; they
// are never uploaded anywhere. =====
const QUEUE_KEY = 'citixen_feedback_queue_v1';
let queue = [];
let pendingImages = []; // data URLs attached to the item currently being composed

function loadQueue(){
  try { queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { queue = []; }
}
function saveQueue(){
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); } catch (e) { /* storage blocked — queue stays in-memory only */ }
}

// ===== DROP / PASTE ZONE =====
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const dropPreview = document.getElementById('dropPreview');

function addImageFile(file){
  if (!file || !file.type || file.type.indexOf('image/') !== 0) return;
  const reader = new FileReader();
  reader.onload = () => {
    pendingImages.push(reader.result);
    renderDropPreview();
  };
  reader.readAsDataURL(file);
}
function renderDropPreview(){
  dropPreview.innerHTML = pendingImages.map(src => '<img src="' + src + '" alt="Attached feedback screenshot">').join('');
}
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
fileInput.addEventListener('change', () => { Array.from(fileInput.files || []).forEach(addImageFile); fileInput.value = ''; });
['dragenter', 'dragover'].forEach(evt => dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }));
dropZone.addEventListener('drop', (e) => { Array.from((e.dataTransfer && e.dataTransfer.files) || []).forEach(addImageFile); });
document.addEventListener('paste', (e) => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  Array.from(items).forEach(item => { if (item.kind === 'file') addImageFile(item.getAsFile()); });
});

// ===== PROMPT SYNTHESIZER — auto-extracts a short note from the raw text and
// generates a structured Claude Task Prompt in the same "================"
// divider + terminal-git-command format this session's own instruction
// attachments use, so an operator can paste it straight into a new Claude
// Code task. =====
function extractNote(rawText){
  const firstLine = (rawText || '').split(/\n/).map(s => s.trim()).find(Boolean);
  if (!firstLine) return 'Untitled feedback item';
  return firstLine.length > 80 ? firstLine.slice(0, 77) + '…' : firstLine;
}
function synthesizePrompt(rawText, imageCount){
  const divider = '================================================================';
  const slug = extractNote(rawText).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40) || 'feedback-item';
  return [
    divider,
    'CITIXEN UX — OPERATOR FEEDBACK TASK',
    divider,
    '',
    'SOURCE: Feedback Ingestion Queue' + (imageCount ? ' (' + imageCount + ' screenshot' + (imageCount === 1 ? '' : 's') + ' attached)' : ''),
    '',
    'RAW FEEDBACK:',
    (rawText || '').trim() || '(no text provided — see attached screenshot(s))',
    '',
    'TASK:',
    '1. Read the raw feedback above (and any attached screenshots) and determine the smallest concrete change that addresses it.',
    '2. Implement the change in citixen-ux.',
    '3. Verify: syntax-check modified scripts, run a Playwright pass with zero console pageerrors.',
    '4. Run exactly:',
    '',
    '   git add . && git commit -m "fix: ' + slug + '" && git push origin main',
    '',
    divider
  ].join('\n');
}

// ===== QUEUE RENDERING =====
const STATUS_CYCLE = ['queued', 'in-execution', 'resolved'];
const STATUS_LABEL = { 'queued': 'Queued', 'in-execution': 'In Execution', 'resolved': 'Resolved' };
function cycleStatus(id){
  const item = queue.find(q => q.id === id);
  if (!item) return;
  const idx = STATUS_CYCLE.indexOf(item.status);
  item.status = STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
  saveQueue();
  renderQueue();
}
async function copyPrompt(id, btn){
  const item = queue.find(q => q.id === id);
  if (!item) return;
  try {
    await navigator.clipboard.writeText(item.prompt);
    const prev = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = prev; btn.classList.remove('copied'); }, 1800);
  } catch (e) { /* clipboard blocked — the prompt text is already visible to select manually */ }
}
function renderQueue(){
  const listEl = document.getElementById('queueList');
  if (!queue.length) {
    listEl.innerHTML = '<div class="empty-note">No feedback items yet — synthesize one above.</div>';
    return;
  }
  listEl.innerHTML = queue.slice().reverse().map(item => {
    const statusClass = item.status;
    return '<div class="queue-item" data-id="' + item.id + '">' +
      '<div class="queue-item-head">' +
        '<div class="queue-item-note">' + escapeHtml(item.note) + '</div>' +
        '<button type="button" class="status-pill ' + statusClass + '" data-cycle="' + item.id + '">' + STATUS_LABEL[item.status] + '</button>' +
      '</div>' +
      '<div class="queue-prompt">' + escapeHtml(item.prompt) + '</div>' +
      '<button type="button" class="btn-copy-prompt" data-copy="' + item.id + '">Copy Prompt</button>' +
    '</div>';
  }).join('');
  listEl.querySelectorAll('[data-cycle]').forEach(btn => {
    btn.addEventListener('click', () => cycleStatus(btn.getAttribute('data-cycle')));
  });
  listEl.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => copyPrompt(btn.getAttribute('data-copy'), btn));
  });
}
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

document.getElementById('btnSynthesize').addEventListener('click', () => {
  const rawEl = document.getElementById('rawFeedback');
  const rawText = rawEl.value;
  if (!rawText.trim() && !pendingImages.length) return;
  const note = extractNote(rawText) || (pendingImages.length ? 'Screenshot feedback' : 'Untitled feedback item');
  const prompt = synthesizePrompt(rawText, pendingImages.length);
  queue.push({
    id: 'fb-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7),
    note,
    prompt,
    status: 'queued',
    images: pendingImages.slice(),
    createdAt: Date.now()
  });
  saveQueue();
  renderQueue();
  rawEl.value = '';
  pendingImages = [];
  renderDropPreview();
});

loadQueue();
renderQueue();
</script>
</body>
</html>
