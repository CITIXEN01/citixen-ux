<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CITIXEN UX™</title>
<meta name="robots" content="noindex">
<!-- Root entry point is a hard redirect into the app. The legacy landing
     page (marketing dashboard preview, CrowdSaveAmerica block grid, share
     buttons) has been fully retired from this route — see vercel.json for
     the server-side permanent redirect that fronts this file in
     production. This client-side redirect is the fallback for any context
     that serves this file directly (e.g. a CDN cache miss or a direct
     static file request that bypasses the Vercel rewrite). -->
<meta http-equiv="refresh" content="0; url=/app">
<link rel="canonical" href="/app">
<!-- OG META IMAGE POLISH & SCALE FIX — this file is also what Vercel's
     catch-all rewrite (see vercel.json) serves, as real markup (not a
     redirect), for any shared link that doesn't match one of the app's
     known routes. A link-preview crawler reading THAT raw HTML (crawlers
     don't execute the JS redirect above or follow a meta-refresh) would
     otherwise see no OG tags at all, so this carries the same preview card
     as app.html — same og-preview-large.png asset, same cache-busting
     query string — rather than leaving this entry point with the gray-box
     fallback app.html's own OG tags were added to fix. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://citixenux.com/app">
<meta property="og:title" content="CITIXEN UX™">
<meta property="og:description" content="Improve Your Civic Experience">
<meta property="og:image" content="https://citixenux.com/og-preview-large.png?v=1000">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="CITIXEN UX™ - Improve Your Civic Experience">
<meta property="og:image:type" content="image/png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="CITIXEN UX™">
<meta name="twitter:description" content="Improve Your Civic Experience">
<meta name="twitter:image" content="https://citixenux.com/og-preview-large.png?v=1000">
<script>window.location.replace('/app');</script>
</head>
<body>
<p>Redirecting to <a href="/app">the CITIXEN UX app</a>&hellip;</p>
</body>
</html>
