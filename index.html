<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CITIXEN UX™</title>
<meta name="robots" content="noindex">
<!-- Root entry point is a hard redirect into the app. The legacy landing
     page (marketing dashboard preview, CrowdSaveAmerica block grid, share
     buttons) has been fully retired from this route — see vercel.json for
     the server-side permanent redirect that fronts this file in
     production. This client-side redirect is the fallback for any context
     that serves this file directly (e.g. a CDN cache miss or a direct
     static file request that bypasses the Vercel rewrite). -->
<meta http-equiv="refresh" content="0; url=/app">
<link rel="canonical" href="/app">
<script>window.location.replace('/app');</script>
</head>
<body>
<p>Redirecting to <a href="/app">the CITIXEN UX app</a>&hellip;</p>
</body>
</html>
