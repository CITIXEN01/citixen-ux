<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Nexus Sales Workspace</title>
<link rel="stylesheet" href="nexuslive-assets/nexuslive.css">
<style>
  /* Single deliberate look: dark slate command surface, emerald/cyan telemetry, red for alerts. */
  :root{--bg:#0F172A;--card:#1E293B;--fg:#E2E8F0;color-scheme:dark}
  html,body{background:var(--bg);color:var(--fg)}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  .boot{padding:48px 16px;text-align:center;font:13px ui-monospace,Menlo,Consolas,monospace;color:#94A3B8}
  @keyframes ticker{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
  [data-nx="layout"]{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
  [data-wo="grid"]{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
  @media (min-width:700px){[data-wo="grid"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:1100px){[data-wo="grid"]{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:1024px){[data-nx="layout"][data-cols="2"]{grid-template-columns:minmax(0,3fr) minmax(0,1fr)}}
  .nx-pill{--c:#34D399;display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--c);background:#0B0F17;color:var(--c);font:700 14px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;text-align:left;cursor:pointer;box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 12%,transparent);transition:box-shadow .2s}
  .nx-pill[data-state="warn"]{--c:#FBBF24}
  .nx-pill[data-state="crit"]{--c:#EF4444}
  .nx-pill:hover{box-shadow:0 0 22px color-mix(in srgb,var(--c) 60%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 18%,transparent)}
  .nx-pill:focus-visible{outline:2px solid #E2E8F0;outline-offset:2px}
  .trk-gates{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .trk-row{display:grid;gap:0 20px;align-items:center;grid-template-columns:minmax(230px,280px) max-content max-content minmax(0,1fr);grid-template-areas:"l m t a";padding:18px 0}
  .trk-row>[data-col=label]{grid-area:l;font-size:20px;font-weight:700;line-height:1.2;color:#F8FAFC}
  .trk-prog{display:contents}
  .trk-meter{gap:8px}
  .trk-seg{display:block;width:40px;height:12px;border-radius:6px;flex-shrink:0}
  .trk-row [data-meter]{grid-area:m;align-self:center;flex-shrink:0}
  .trk-row>[data-col=actions]{grid-area:a}
  .trk-tele{grid-area:t;display:block;margin:0;padding:0;align-self:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:500;line-height:1.2;color:#CBD5E1;white-space:nowrap}
  .nx-emerald{color:#34D399;border:1px solid rgba(16,185,129,.4);background:rgba(2,44,34,.2);border-radius:999px;padding:10px 20px;font-size:14px;font-weight:700;letter-spacing:.02em;line-height:1.2;min-height:44px;align-items:center;font-family:inherit;white-space:nowrap}
  button.nx-emerald:hover{background:rgba(2,44,34,.5);border-color:rgba(52,211,153,.7)}
  .nx-oncall{align-items:center;border-radius:999px;border:1px solid rgba(16,185,129,.4);background:rgba(2,44,34,.2);padding:6px 12px;font-size:12px;font-weight:700;min-height:32px;white-space:nowrap;font-family:inherit}
  .nx-oncall[data-oncall=off]{border-color:#334155;background:rgba(15,23,42,.8)}
  .nx-tb{display:inline-flex}
  .nx-desk-only{display:none}@media (min-width:768px){.nx-desk-only{display:inline-flex}}
  .nx-emerald{display:inline-flex}.nx-emerald.nx-desk-only{display:none}@media (min-width:768px){.nx-emerald.nx-desk-only{display:inline-flex}}
  .trk-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center}
  @media (max-width:767px){
    .trk-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l m" "t t" "a a";gap:0 16px;padding:16px 0 10px}
    .trk-prog{display:contents}
    .trk-row [data-meter]{grid-area:m;justify-self:end;align-self:center;flex-shrink:0;min-width:146px}
    .trk-meter{gap:6px}.trk-seg{width:32px;height:10px;border-radius:5px}
    .trk-row>[data-col=label]{align-self:center;min-width:0;font-size:14px}
    .trk-tele{justify-self:end;margin-top:10px;padding:4px 0 4px}
    .trk-acts{grid-area:a;margin-top:14px;margin-bottom:8px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:8px}
    .trk-acts>button{width:100%;display:flex;justify-content:center;text-align:center}
    .nx-hdr-right{width:100%;justify-content:center !important;gap:12px !important}
  }
  .nx-city{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left;text-decoration:none}
  .nx-city:hover,.nx-city:focus-visible{text-decoration:underline;text-underline-offset:3px;outline:none}
  .nx-hscroll{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:#334155 transparent}
  .nx-note{box-sizing:border-box;border:1px solid #334155;background:#0F172A;color:#F1F5F9;border-radius:999px;padding:10px 16px;font-size:14px;min-height:44px}
  .nx-note-green{border-color:#10B981;background:rgba(16,185,129,.08)}
  .nx-note::placeholder{color:#64748B}
  .nx-note:focus{outline:none;border-color:#34D399;box-shadow:0 0 0 1px #34D399}
  .nx-solid-emerald{display:inline-flex;align-items:center;justify-content:center;background:#10B981;color:#04130D;border:1px solid #34D399;border-radius:999px;padding:10px 20px;min-height:44px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
  .nx-solid-emerald:hover:not(:disabled){background:#34D399}
  .nx-solid-emerald.nx-dim,.nx-solid-emerald:disabled{opacity:.45;cursor:not-allowed}
  .trk-head{justify-content:center;text-align:center}.trk-head .trk-legend{display:none}
  @media (min-width:768px){.trk-head{justify-content:flex-start;text-align:left}.trk-head .trk-legend{display:inline-block}}
  .trk-pillars{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
  @media (max-width:700px){.trk-pillars{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .nx-glow-green{color:#34D399;border:1px solid #34D399;box-shadow:0 0 14px rgba(52,211,153,.45),inset 0 0 8px rgba(52,211,153,.15);background:#06150F;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:800;letter-spacing:.02em;line-height:1.2;min-height:44px;display:inline-flex;align-items:center;font-family:inherit;white-space:nowrap}
  .nx-pulse-amber{animation:nxbreathe 2.5s ease-in-out infinite}
  .nx-toast{animation:nxtoast 2s ease forwards}


  .nx-tbmenu{position:absolute;top:calc(100% + 8px);right:0;z-index:70;width:min(340px,calc(100vw - 32px));background:#0F172A;border:1px solid #334155;border-radius:14px;box-shadow:0 24px 50px -12px rgba(0,0,0,.7);padding:6px}
  .nx-tbmenu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;min-height:48px;cursor:pointer;color:#F8FAFC;font-family:inherit}
  .nx-tbmenu button b{font-size:15px;font-weight:700}
  .nx-tbmenu button span{font-size:12.5px;color:#94A3B8}
  .nx-tbmenu button:hover,.nx-tbmenu button:focus-visible{background:#1E293B;outline:none}
  .nx-tbsep{height:1px;background:#26344F;margin:4px 6px}
  @media (max-width:640px){.nx-tbmenu{position:fixed;top:auto;left:16px;right:16px;width:auto}}
  .crm-head,.crm-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:center;padding:12px 18px}
  .crm-head{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#94A3B8;border-bottom:1px solid #26344F}
  .crm-row{border-bottom:1px solid #1E293B;font-size:14px;color:#E2E8F0}
  .crm-row:last-child{border-bottom:0}
  .crm-city{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;min-width:0}
  .crm-city em{font-size:12px;color:#94A3B8;font-style:normal}
  .crm-age{font:500 13px ui-monospace,Menlo,monospace;color:#CBD5E1}
  @media (max-width:760px){.crm-head{display:none}.crm-row{grid-template-columns:minmax(0,1fr);gap:4px;padding:14px 16px}}
  .nxg-banner{margin:0 0 10px;font-size:15px;font-weight:800;color:#F8FAFC}
  .nxg-bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
  .nxg-fill{font:700 14px inherit;font-family:inherit;background:#F59E0B;color:#0F172A;border:0;border-radius:999px;padding:10px 18px;min-height:42px;cursor:pointer}
  .nxg-ghost{font:600 13px inherit;font-family:inherit;color:#F8FAFC;background:#111C33;border:1px solid #334155;border-radius:999px;padding:10px 16px;min-height:42px;cursor:pointer}
  .nxg-ghost:disabled{opacity:.4;cursor:not-allowed}
  .nxg-steps{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .nxg-step{width:100%;display:flex;align-items:center;gap:8px;text-align:left;font:600 13px inherit;font-family:inherit;color:#CBD5E1;background:#111C33;border:1px solid #334155;border-radius:12px;padding:9px 10px;min-height:46px;cursor:pointer}
  .nxg-step b{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#0F172A;border:1px solid #475569;font-size:12px}
  .nxg-step.on{border-color:#3B82F6;color:#F8FAFC;box-shadow:0 0 12px rgba(59,130,246,.4)}
  .nxg-step.ok b{background:#10B981;border-color:#10B981;color:#0F172A}
  .nxg-main{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
  .nxg-main.pv{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .nxg-card,.nxg-pv{background:#111C33;border:1px solid #26344F;border-radius:14px;padding:16px 18px;min-width:0}
  .nxg-card h3{margin:0 0 12px;font-size:18px;font-weight:800;color:#F8FAFC}
  .nxg-pv h4{margin:0 0 6px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#94A3B8}
  .nxg-pv pre{margin:0 0 14px;white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.5 ui-monospace,Menlo,monospace;color:#E2E8F0;background:#0F172A;border:1px solid #26344F;border-radius:10px;padding:12px;max-height:340px;overflow:auto}
  .nxg-pv ul{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
  .nxg-pv li{display:flex;flex-direction:column;gap:2px;background:#0F172A;border:1px solid #26344F;border-radius:10px;padding:8px 10px;font-size:13px;color:#CBD5E1;overflow-wrap:anywhere}
  .nxg-pv li b{color:#F8FAFC}
  .nxg-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .nxg-l{display:block;font-size:13px;color:#CBD5E1;font-weight:600}
  .nxg-note{margin:0 0 12px;font-size:13px;color:#CBD5E1}
  .nxg-fs{border:1px solid #26344F;border-radius:12px;margin:0 0 10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
  .nxg-fs legend{font-size:14px;color:#F1F5F9;padding:0 4px;overflow-wrap:anywhere}
  .nxg-pill{font:700 13px inherit;font-family:inherit;color:#F8FAFC;background:#0F172A;border:1px solid #475569;border-radius:999px;padding:8px 16px;min-height:38px;cursor:pointer}
  .nxg-pill[aria-pressed=true].nxg-yes{background:#10B981;border-color:#10B981;color:#0F172A}
  .nxg-pill[aria-pressed=true].nxg-no{background:#EF4444;border-color:#EF4444;color:#fff}
  .nxg-pill[aria-pressed=true].nxg-unsure{background:#F59E0B;border-color:#F59E0B;color:#0F172A}
  .nxg-sum{margin:10px 0 0;font:600 13px ui-monospace,Menlo,monospace;color:#94A3B8}
  .nxg-chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:#F1F5F9}
  .nxg-chk input{margin-top:3px;width:18px;height:18px;flex:none}
  .nxg-nav,.nxg-row{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
  .nxg-done{margin-top:14px;padding:12px 14px;border:1px solid #10B981;background:rgba(16,185,129,.12);border-radius:12px;font-size:14px;color:#E2E8F0}
  .nxg-done b{color:#34D399}
  .nxg-small{margin:10px 0 0;font-size:12px;color:#94A3B8}
  @media (max-width:760px){.nxg-main.pv{grid-template-columns:minmax(0,1fr)}.nxg-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .nxf-bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
  .nxf-bar button{font:600 13px/1 inherit;font-family:inherit;color:#F8FAFC;background:#111C33;border:1px solid #334155;border-radius:999px;padding:10px 14px;min-height:40px;cursor:pointer}
  .nxf-bar button[aria-pressed=true]{border-color:#10B981;box-shadow:0 0 0 1px #10B981 inset,0 0 12px rgba(16,185,129,.35)}
  .nxf-wrap{position:relative;display:flex;align-items:stretch;border:1px solid #26344F;border-radius:14px;background:#0F172A;overflow:hidden}
  .nxf-frame{flex:1 1 auto;min-width:0;overflow:auto;height:min(64vh,720px);background-image:radial-gradient(#1B2943 1px,transparent 1px);background-size:26px 26px}
  .nxf-frame svg{display:block;height:auto;max-width:none}
  .nxf-node{cursor:pointer;outline:none}
  .nxf-node .nxf-shape{transition:filter .2s,stroke-width .2s}
  .nxf-node:hover .nxf-shape,.nxf-node.nxf-sel .nxf-shape,.nxf-node:focus-visible .nxf-shape{filter:drop-shadow(0 0 10px var(--glow));stroke-width:3.2}
  .nxf-edge{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;transition:opacity .2s}
  .nxf-edge.nxf-on{stroke-width:3.4}
  .nxf-edge[data-flow="1"]{stroke-dasharray:9 7;animation:nxfdash .9s linear infinite}
  @keyframes nxfdash{to{stroke-dashoffset:-16}}
  @media (prefers-reduced-motion:reduce){.nxf-edge[data-flow="1"]{animation:none}}
  .nxf-dim{opacity:.18}
  .nxf-drawer{position:relative;flex:0 0 min(380px,42%);width:min(380px,42%);max-height:min(64vh,720px);box-sizing:border-box;overflow-y:auto;background:#111C33;border-left:1px solid #334155;box-shadow:-18px 0 40px rgba(2,6,12,.55);padding:16px 18px 22px;animation:nxfslide .22s ease-out}
  .nxf-drawer[hidden]{display:none}
  @keyframes nxfslide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
  .nxf-dtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .nxf-tag{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}

  .nxf-drawer h3{margin:8px 0 4px;font-size:19px;font-weight:800;color:#F8FAFC;overflow-wrap:anywhere}
  .nxf-drawer .nxf-sub{margin:0 0 6px;color:#CBD5E1;font-size:14px;overflow-wrap:anywhere}
  .nxf-drawer .nxf-sum{margin:6px 0 12px;color:#E2E8F0;font-size:14px;overflow-wrap:anywhere}
  .nxf-sec{margin-top:14px}
  .nxf-sec h4{margin:0 0 6px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#94A3B8}
  .nxf-sec ul{margin:0;padding-left:18px;color:#F1F5F9;font-size:14px}
  .nxf-sec li{margin:0 0 6px;overflow-wrap:anywhere}
  .nxf-q{background:#0F172A;border:1px solid #26344F;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;color:#E2E8F0}
  .nxf-q b{display:block;color:#FBBF24;margin-bottom:4px}
  .nxf-meta{margin:16px 0 0;font:500 12px ui-monospace,Menlo,monospace;color:#94A3B8}
  .nxf-hint{margin:10px 0 0;font-size:12.5px;color:#94A3B8}
  .nxf-eyebrow{margin:0;font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#94A3B8}
  .nxf-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
  .nxf-tabs button{font:700 14px inherit;font-family:inherit;color:#F8FAFC;background:#111C33;border:1px solid #334155;border-radius:12px;padding:10px 16px;min-height:42px;cursor:pointer}
  .nxf-tabs button[aria-selected=true]{border-color:#10B981;background:rgba(16,185,129,.12);box-shadow:0 0 14px rgba(16,185,129,.3)}
  @media (max-width:640px){.nxf-drawer{position:absolute;top:auto;right:0;bottom:0;left:0;flex:none;width:100%;height:62%;max-height:none;border-left:0;border-top:1px solid #334155}}

  @keyframes nxtoast{0%{opacity:0;transform:scale(.96)}10%{opacity:1;transform:scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.98)}}
  .nx-pulse-strong{animation:nxpulse 1.2s ease-in-out infinite}
  @keyframes nxpulse{0%,100%{box-shadow:0 0 8px rgba(251,191,36,.35);opacity:.8}50%{box-shadow:0 0 28px rgba(251,191,36,.95);opacity:1}}
  @keyframes nxbreathe{0%,100%{box-shadow:0 0 5px rgba(251,191,36,.18);opacity:.82}50%{box-shadow:0 0 18px rgba(251,191,36,.6);opacity:1}}
  @media (prefers-reduced-motion:reduce){.nx-pulse-strong{animation:none;box-shadow:0 0 16px rgba(251,191,36,.7)}.nx-pulse-amber{animation:none;box-shadow:0 0 12px rgba(251,191,36,.45)}}
  .nx-pill-label{white-space:normal;min-width:0;line-height:1.25}
  .nx-dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex-shrink:0;box-shadow:0 0 8px var(--c);animation:nxdot 1.6s ease-in-out infinite}
  @keyframes nxdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  @media (prefers-reduced-motion:reduce){.nx-dot{animation:none}}
  .nx-ctl{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  .nx-pill[data-state="warn"],.nx-pill[data-state="crit"]{animation:nxblink 1.1s ease-in-out infinite}
  .nx-pill[data-state="crit"]{animation-duration:.8s}
  @keyframes nxblink{0%,100%{box-shadow:0 0 22px color-mix(in srgb,var(--c) 75%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 25%,transparent);border-color:var(--c)}50%{box-shadow:0 0 4px color-mix(in srgb,var(--c) 20%,transparent);border-color:color-mix(in srgb,var(--c) 35%,transparent)}}
  @media (prefers-reduced-motion:reduce){.nx-pill[data-state="warn"],.nx-pill[data-state="crit"]{animation:none}}
  [data-nx="layout"][data-aside="slim"]{grid-template-columns:minmax(0,1fr)}
  @media (min-width:1024px){[data-nx="layout"][data-aside="slim"]{grid-template-columns:minmax(0,1fr) 240px}}
  @keyframes slowpulse{0%,100%{box-shadow:0 0 25px rgba(16,185,129,.25)}50%{box-shadow:0 0 70px rgba(16,185,129,.6)}}
  @keyframes flicker{0%,19%,22%,62%,64%,100%{opacity:1}20%,21%,63%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.ticker,.slowpulse,.flicker{animation:none!important}}
</style>
