<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --brand-mint:#00ff88;
    --bg-obsidian:#080c0a;
    --bg-card:#0f1713;
    --border-muted:rgba(255,255,255,0.08);
    --text:#f8fafc;
    --muted:#8e9fa8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;background:var(--bg-obsidian);overflow:hidden}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .label{
    font-family:'SF Mono','Courier New',ui-monospace,monospace;
    font-size:26px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    opacity:0;animation:fadeUp 700ms ease-out forwards;
  }
  .stats{
    display:flex;gap:40px;
    opacity:0;animation:fadeUp 800ms ease-out 400ms forwards;
  }
  .stat{
    background:var(--bg-card);border:1px solid var(--border-muted);border-radius:22px;
    padding:48px 56px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:340px;
  }
  .stat.field{border-color:rgba(0,255,136,0.35);}
  .stat .num{font-size:86px;font-weight:800;letter-spacing:-1px;}
  .stat.field .num{color:var(--brand-mint);}
  .stat.admin .num{color:var(--text);}
  .stat .cap{font-size:24px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .sub{
    font-size:28px;font-weight:600;color:var(--text);text-align:center;max-width:820px;line-height:1.5;
    opacity:0;animation:fadeUp 800ms ease-out 1000ms forwards;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(18px);}
    to{opacity:1;transform:translateY(0);}
  }
</style>
</head>
<body>
  <div class="label">Across a whole ward</div>
  <div class="stats">
    <div class="stat field">
      <div class="num">+34%</div>
      <div class="cap">Field</div>
    </div>
    <div class="stat admin">
      <div class="num">&minus;18%</div>
      <div class="cap">Admin</div>
    </div>
  </div>
  <div class="sub">More budget into repair. Less into red tape.</div>
</body>
</html>
